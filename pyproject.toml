[project]
name = "incident-triage-agent"
version = "0.1.0"
description = "A multi-step AI agent that investigates on-call incidents via tool use."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "mcp>=2.1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
triage-mcp = "triage.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# CPU-only PyTorch: no CUDA. Smaller install, and we use Apple MPS locally / CPU in CI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
